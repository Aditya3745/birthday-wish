<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎉</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow-x: hidden;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      animation: fadeIn 1s ease;
    }

    h1 {
      color: #ff4d6d;
    }

    img {
      width: 100%;
      border-radius: 15px;
      margin: 15px 0;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.1);
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);} 
      to {opacity: 1; transform: translateY(0);} 
    }

    .balloon {
      position: absolute;
      width: 40px;
      height: 50px;
      border-radius: 50%;
      animation: float 6s infinite ease-in;
    }

    @keyframes float {
      0% { transform: translateY(100vh); }
      100% { transform: translateY(-10vh); }
    }

  </style>
</head>
<body>

<!-- Local Background Music (No permission popup) -->
<audio id="bgMusic" src="assets/music/birthday.mp3" loop></audio>

<div class="container">
  <div class="card">
    <h1 id="title">Happy Birthday 🎉🎂</h1>
    <img src="assets/gifs/birthday.gif" alt="Birthday GIF">
    <p id="message">Wishing you a day filled with love, joy, and cake! 🎁✨</p>

    <button onclick="startExperience()">Click for Surprise 🎁</button>

    <p id="surpriseText" class="hidden">You are amazing! 💖🎈</p>
    <img id="surpriseImg" class="hidden" src="assets/images/cake.png" alt="Cake">
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');

  if (name) {
    document.getElementById('title').innerText = `Happy Birthday ${name}! 🎉🎂`;
  }

  function startExperience() {
    // Play music after user interaction (no popup issue)
    const music = document.getElementById('bgMusic');
    music.play().catch(() => {});

    surprise();
  }

  function surprise() {
    document.getElementById('surpriseText').classList.remove('hidden');
    document.getElementById('surpriseImg').classList.remove('hidden');
    createConfetti();
  }

  function createConfetti() {
    for (let i = 0; i < 50; i++) {
      const confetti = document.createElement('div');
      confetti.style.position = 'fixed';
      confetti.style.width = '10px';
      confetti.style.height = '10px';
      confetti.style.background = `hsl(${Math.random()*360}, 100%, 50%)`;
      confetti.style.top = Math.random() * window.innerHeight + 'px';
      confetti.style.left = Math.random() * window.innerWidth + 'px';
      confetti.style.opacity = 0.7;
      confetti.style.transition = 'transform 1s ease-out';

      document.body.appendChild(confetti);

      setTimeout(() => {
        confetti.style.transform = 'translateY(100px)';
      }, 10);

      setTimeout(() => {
        confetti.remove();
      }, 1000);
    }
  }

  function createBalloons() {
    for (let i = 0; i < 10; i++) {
      const balloon = document.createElement('div');
      balloon.classList.add('balloon');
      balloon.style.left = Math.random() * 100 + 'vw';
      balloon.style.background = `hsl(${Math.random()*360}, 100%, 60%)`;
      balloon.style.animationDuration = (4 + Math.random()*3) + 's';
      document.body.appendChild(balloon);
    }
  }

  createBalloons();
</script>

</body>
</html>
